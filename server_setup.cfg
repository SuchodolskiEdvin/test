// ========================================
// LAN WINGMAN TOURNAMENT
// Base tournament settings
// ========================================

// Make sure we are Wingman
game_type 0
game_mode 2

// LAN
sv_lan 1

// --------------------
// MATCH
// --------------------

mp_maxrounds 16
mp_match_can_clinch 1

// --------------------
// OVERTIME
// --------------------

mp_overtime_enable 1
mp_overtime_maxrounds 2
mp_overtime_limit 0

// --------------------
