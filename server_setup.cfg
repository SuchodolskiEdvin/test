mp_roundtime 1.5
mp_roundtime_defuse 1.5

mp_buytime 20
mp_buy_anywhere 0

mp_halftime 1

// --------------------
// TEAMS
// --------------------

mp_autoteambalance 0
mp_limitteams 0

// --------------------
// RESPAWN
// --------------------

mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0

// --------------------
// FRIENDLY FIRE
// --------------------

mp_friendlyfire 1

// --------------------
// MATCH CONTROL
// --------------------

mp_timelimit 0
mp_match_end_restart 0

// --------------------
// VOTES
// --------------------

sv_allow_votes 0

// --------------------
// COMMUNICATION
// --------------------

sv_talk_enemy_living 0
sv_talk_enemy_dead 0
sv_deadtalk 1

// Remove bots from the original Practice match
bot_kick

echo "========================================"
echo " LAN WINGMAN TOURNAMENT CONFIG LOADED "
