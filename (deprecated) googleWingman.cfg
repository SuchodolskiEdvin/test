// ========================================
// CS2 WINGMAN TOURNAMENT
// Standard Wingman - 16 rounds
// Custom OT: 1 round per side
// ========================================

// Game mode
game_type 0
game_mode 2

// Match structure
mp_maxrounds 16
mp_match_can_clinch 1

// Overtime
mp_overtime_enable 1
mp_overtime_maxrounds 2
mp_overtime_limit 0

// OT starts with fresh economy
mp_overtime_startmoney 8000

// Standard Wingman economy
mp_startmoney 800
mp_maxmoney 8000

// Halftime / side switch
mp_halftime 1
mp_overtime_halftime_pausetimer 0

// Standard Wingman round settings
mp_roundtime 1.5
mp_roundtime_defuse 1.5
mp_freezetime 10
mp_round_restart_delay 7

// Teams
mp_autoteambalance 0
mp_limitteams 0

// Friendly fire
mp_friendlyfire 1

// Buy
mp_buytime 20
mp_buy_anywhere 0

// Respawn
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0

// Votes
sv_allow_votes 0

// Spectator / communication
sv_talk_enemy_living 0
sv_talk_enemy_dead 0
sv_deadtalk 1

// Misc
mp_timelimit 0
mp_match_end_restart 0
mp_randomspawn 0
